name: Nhóm, đăng ký đề tài, báo cáo - MySQL 8.4 và HTTP

on:
  push:
    branches: ["feat/nhom-dang-ky-bao-cao"]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  nhom-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NHOM_TEST_DB_URL: jdbc:mysql://127.0.0.1:3307/nhom_test_ci?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      NHOM_TEST_DB_USERNAME: nhom_test
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3307/nhom_test_ci?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: nhom_test
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_SHOW_SQL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Tạo MySQL riêng và mật khẩu dùng một lần
        shell: bash
        run: |
          set -euo pipefail
          task_db_password=$(openssl rand -hex 24)
          echo "::add-mask::$task_db_password"
          printf 'NHOM_TEST_DB_PASSWORD=%s\nSPRING_DATASOURCE_PASSWORD=%s\n' "$task_db_password" "$task_db_password" >> "$GITHUB_ENV"
          docker run --detach --name nhom-mysql --publish 127.0.0.1:3307:3306 \
            --env MYSQL_RANDOM_ROOT_PASSWORD=yes --env MYSQL_DATABASE=nhom_test_ci \
            --env MYSQL_USER=nhom_test --env MYSQL_PASSWORD="$task_db_password" mysql:8.4.7
          for attempt in $(seq 1 60); do
            if docker exec nhom-mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -u"$MYSQL_USER" -e "SELECT 1"' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL thử nghiệm chưa sẵn sàng." >&2
          exit 1
      - name: Kiểm thử toàn bộ và đóng gói
        run: mvn -B -ntp -f backend/pom.xml clean verify
      - name: Dọn MySQL thử nghiệm
        if: always()
        run: docker rm -f nhom-mysql
