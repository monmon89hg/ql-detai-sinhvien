
name: CI - Spring Boot Build & Test

on:
  push:
    branches:
      - develop
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"
      - "docs/**"

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and UI Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test Spring Boot
        run: mvn -B -ntp -f backend/pom.xml "-Dtest=FrontendIntegrationTests,OfficialSecurityTests,SecurityProfilesTests,SecurityMethodAuthorizationTests,AuthIdentityTests,CongBoKetQuaServiceTests,TongHopKetQuaServiceTests,TraCuuKetQuaServiceTests" clean verify
