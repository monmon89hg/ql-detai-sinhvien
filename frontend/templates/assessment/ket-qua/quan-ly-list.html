<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/head :: head('Quản lý kết quả')}"></head>

    <body>
        <a class="skip" href="#content">Bỏ qua điều hướng</a>
        <div th:replace="~{fragments/header :: header}"></div>
        <div class="backdrop"></div>

        <div class="app-grid">
            <div th:replace="~{fragments/sidebar :: sidebar('publish-result')}"></div>

            <main class="page" id="content">
                <div
                    th:replace="~{fragments/breadcrumb :: breadcrumb('Quản lý kết quả')}"
                ></div>

                <div class="container">
                    <div th:replace="~{fragments/messages :: messages}"></div>

                    <div class="page-heading">
                        <h1>Quản lý kết quả</h1>
                        <p>Xem kết quả tổng hợp và công bố cho nhóm sinh viên.</p>
                    </div>

                    <section class="section">
                        <div class="section-top">
                            <h2 class="section-title">Danh sách nhóm</h2>
                        </div>

                        <p th:if="${#lists.isEmpty(danhSachNhom)}">
                            Chưa có nhóm nào được phân công hội đồng.
                        </p>

                        <table
                            class="data-table"
                            th:unless="${#lists.isEmpty(danhSachNhom)}"
                        >
                            <thead>
                                <tr>
                                    <th scope="col">Nhóm</th>
                                    <th scope="col">Đề tài</th>
                                    <th scope="col">Hội đồng</th>
                                    <th scope="col">Trạng thái</th>
                                    <th scope="col">Điểm cuối</th>
                                    <th scope="col">Thao tác</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="nhom : ${danhSachNhom}">
                                    <td>
                                        <strong th:text="${nhom.maNhom}"></strong>
                                        <div th:text="${nhom.tenNhom}"></div>
                                    </td>
                                    <td>
                                        <strong th:text="${nhom.maDeTai}"></strong>
                                        <div th:text="${nhom.tenDeTai}"></div>
                                    </td>
                                    <td>
                                        <strong th:text="${nhom.maHoiDong}"></strong>
                                        <div th:text="${nhom.tenHoiDong}"></div>
                                    </td>
                                    <td>
                                        <span th:if="${nhom.trangThaiKetQua == null}">
                                            Chưa tổng hợp
                                        </span>
                                        <span th:if="${nhom.trangThaiKetQua == 'DA_TONG_HOP'}">
                                            Chờ công bố
                                        </span>
                                        <span th:if="${nhom.trangThaiKetQua == 'CONG_BO'}">
                                            Đã công bố
                                        </span>
                                    </td>
                                    <td
                                        th:text="${nhom.diemCuoi != null
                                            ? nhom.diemCuoi : '—'}"
                                    ></td>
                                    <td>
                                        <!-- Chỉ kết quả đã tổng hợp mới được công bố. -->
                                        <form
                                            th:if="${nhom.trangThaiKetQua == 'DA_TONG_HOP'}"
                                            th:action="@{/ket-qua/{maNhom}/cong-bo(
                                                maNhom=${nhom.maNhom})}"
                                            method="post"
                                            onsubmit="return confirm('Xác nhận công bố kết quả?');"
                                        >
                                            <input
                                                type="hidden"
                                                th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}"
                                            >
                                            <button class="btn btn-primary" type="submit">
                                                Công bố
                                            </button>
                                        </form>
                                        <span
                                            th:unless="${nhom.trangThaiKetQua == 'DA_TONG_HOP'}"
                                        >
                                            —
                                        </span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </section>

                    <div th:replace="~{fragments/footer :: footer}"></div>
                </div>
            </main>
        </div>

        <script th:src="@{/js/common.js}"></script>
    </body>
</html>
