<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/head :: head('Sửa thông tin hội đồng')}"></head>
    <body>
        <a class="skip" href="#content">Bỏ qua điều hướng</a>
        <div th:replace="~{fragments/header :: header}"></div>
        <div class="backdrop"></div>

        <div class="app-grid">
            <div th:replace="~{fragments/sidebar :: sidebar('council')}"></div>
            <main class="page" id="content">
                <div th:replace="~{fragments/breadcrumb :: breadcrumb('Sửa thông tin hội đồng')}"></div>
                <div class="container sv-module">
                    <div th:replace="~{fragments/messages :: messages}"></div>
                    <div class="page-heading">
                        <h1>Sửa thông tin hội đồng</h1>
                        <p>Cập nhật thông tin hội đồng khi còn ở trạng thái nháp.</p>
                    </div>

                    <section class="section sv-panel">
                        <form th:action="@{/hoi-dong/{maHoiDong}/sua(maHoiDong=${hoiDong.maHoiDong})}"
                              th:object="${hoiDongSuaForm}" method="post">
                            <input type="hidden" th:field="*{version}">
                            <p th:if="${#fields.hasErrors('version')}" th:errors="*{version}"></p>

                            <div class="form-field">
                                <label for="maHoiDong">Mã hội đồng *</label>
                                <input class="form-control" type="text" th:field="*{maHoiDong}"
                                       maxlength="30" required>
                                <small th:if="${#fields.hasErrors('maHoiDong')}"
                                       th:errors="*{maHoiDong}"></small>
                            </div>
                            <div class="form-field">
                                <label for="tenHoiDong">Tên hội đồng *</label>
                                <input class="form-control" type="text" th:field="*{tenHoiDong}"
                                       maxlength="150" required>
                                <small th:if="${#fields.hasErrors('tenHoiDong')}"
                                       th:errors="*{tenHoiDong}"></small>
                            </div>
                            <div class="form-field">
                                <label for="maDot">Mã đợt đăng ký</label>
                                <input class="form-control" id="maDot" type="text"
                                       th:value="${hoiDong.maDot}" readonly>
                                <small>Không thay đổi đợt đăng ký của hội đồng.</small>
                            </div>
                            <div class="form-field">
                                <label for="diaDiem">Địa điểm</label>
                                <input class="form-control" type="text" th:field="*{diaDiem}"
                                       maxlength="200">
                                <small th:if="${#fields.hasErrors('diaDiem')}"
                                       th:errors="*{diaDiem}"></small>
                            </div>
                            <div class="btn-row">
                                <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
                                <a class="btn btn-outline"
                                   th:href="@{/hoi-dong/{maHoiDong}(maHoiDong=${hoiDong.maHoiDong})}">
                                    Hủy
                                </a>
                            </div>
                        </form>
                    </section>
                    <div th:replace="~{fragments/footer :: footer}"></div>
                </div>
            </main>
        </div>
        <script th:src="@{/js/common.js}"></script>
    </body>
</html>
