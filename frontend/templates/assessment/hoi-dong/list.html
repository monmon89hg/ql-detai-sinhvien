<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/head :: head('Quản lý hội đồng')}"></head>

    <body>
        <a class="skip" href="#content">Bỏ qua điều hướng</a>

        <div th:replace="~{fragments/header :: header}"></div>
        <div class="backdrop"></div>

        <div class="app-grid">
            <div th:replace="~{fragments/sidebar :: sidebar('council')}"></div>

            <main class="page" id="content">
                <div
                    th:replace="~{fragments/breadcrumb :: breadcrumb('Quản lý hội đồng')}"
                ></div>

                <div class="container sv-module">
                    <div th:replace="~{fragments/messages :: messages}"></div>

                    <div class="page-heading">
                        <h1>Quản lý hội đồng</h1>
                        <p>Quản lý thông tin, thành viên và phân công hội đồng chấm đề tài.</p>
                    </div>

                    <section class="section sv-panel">

                        <div class="section-top sv-panel-heading">
                            <h2 class="section-title">Danh sách hội đồng</h2>

                            <a
                                class="btn btn-primary"
                                th:if="${coQuyenTaoHoiDong}"
                                th:href="@{/hoi-dong/tao}"
                            >
                                Tạo hội đồng
                            </a>
                        </div>

                        <p th:if="${#lists.isEmpty(danhSachHoiDong)}">
                            Chưa có hội đồng nào trong hệ thống.
                        </p>


                        <div class="sv-table-wrap"
                            th:unless="${#lists.isEmpty(danhSachHoiDong)}"
                        >
                            <table class="data-table sv-table">
                                <thead>
                                    <tr>
                                        <th scope="col">STT</th>
                                        <th scope="col">Mã hội đồng</th>
                                        <th scope="col">Tên hội đồng</th>
                                        <th scope="col">Mã đợt</th>
                                        <th scope="col">Địa điểm</th>
                                        <th scope="col">Trạng thái</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr th:each="hoiDong, viTri : ${danhSachHoiDong}">
                                        <td th:text="${viTri.count}"></td>
                                        <td>
                                            <a
                                                th:href="@{/hoi-dong/{maHoiDong}(maHoiDong=${hoiDong.maHoiDong})}"
                                                th:text="${hoiDong.maHoiDong}"
                                            ></a>
                                        </td>
                                        <td th:text="${hoiDong.tenHoiDong}"></td>
                                        <td th:text="${hoiDong.maDot}"></td>
                                        <td
                                            th:text="${#strings.isEmpty(hoiDong.diaDiem)
                                                ? 'Chưa cập nhật' : hoiDong.diaDiem}"
                                        ></td>
                                        <td th:text="${hoiDong.trangThai}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <div th:replace="~{fragments/footer :: footer}"></div>
                </div>
            </main>
        </div>

        <script th:src="@{/js/common.js}"></script>
    </body>
</html>
