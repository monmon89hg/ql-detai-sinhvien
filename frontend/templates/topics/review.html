<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Duyệt đề tài')}"></head>
<body>
<a class="skip" href="#content">Bỏ qua điều hướng</a>
<div th:replace="~{fragments/header :: header}"></div>
<div class="backdrop"></div>

<div class="app-grid">
    <div th:replace="~{fragments/sidebar :: sidebar('approve-topic')}"></div>

    <main class="page" id="content">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb('Duyệt đề tài')}"></div>

        <div class="container">
            <div th:replace="~{fragments/messages :: messages}"></div>

            <div class="page-heading">
                <h1>Duyệt đề tài</h1>
            </div>

            <div class="placeholder" style="max-width: 100%;">
                <div class="table-responsive">
                    <table class="data-table" style="vertical-align: middle;">
                        <thead>
                            <tr>
                                <th style="text-align: center; white-space: nowrap;">Mã đề tài</th>
                                <th style="text-align: left;">Tên đề tài</th>
                                <th style="text-align: center; white-space: nowrap;">Xét duyệt</th>
                                <th style="text-align: center; white-space: nowrap;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(deTais)}">
                                <td colspan="4" style="text-align:center; padding: 32px 20px; color:#557085; font-size: 13.5px;">
                                    Hiện chưa có đề tài nào cần xét duyệt.
                                </td>
                            </tr>
                            <tr th:each="dt : ${deTais}" style="vertical-align: middle;">
                                <td style="text-align: left; white-space: nowrap;">
                                    <strong th:text="${dt.maDeTai}">DT001</strong>
                                </td>
                                <td>
                                    <strong th:text="${dt.tenDeTai}">Hệ thống quản lý đề tài</strong>
                                    <br><small style="color:#697f91;">Đợt đăng ký: <span th:text="${dt.maDot}">DOT-01</span></small>
                                </td>
                                <td style="text-align: center; vertical-align: middle;">
                                    <div style="display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: nowrap;">
                                        <!-- Nút Duyệt -->
                                        <form th:action="@{/de-tai/{maDeTai}/duyet(maDeTai=${dt.maDeTai})}" method="post" style="display:inline; margin:0;">
                                            <button type="submit" class="btn btn-outline" style="min-height:30px; padding:4px 12px; font-size:12px; white-space: nowrap;">Duyệt</button>
                                        </form>

                                        <!-- Nút Từ chối -->
                                        <form th:action="@{/de-tai/{maDeTai}/tu-choi(maDeTai=${dt.maDeTai})}" method="post" style="display:inline; margin:0;" onsubmit="var reason = prompt('Nhập lý do từ chối đề tài:'); if(!reason) return false; this.lyDoTuChoi.value = reason;">
                                            <input type="hidden" name="lyDoTuChoi" value="">
                                            <button type="submit" class="btn btn-outline" style="min-height:30px; padding:4px 12px; font-size:12px; white-space: nowrap;">Từ chối</button>
                                        </form>
                                    </div>
                                </td>
                                <td style="text-align: center; vertical-align: middle;">
                                    <div style="display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: nowrap;">
                                        <a th:href="@{/de-tai/sua/{maDeTai}(maDeTai=${dt.maDeTai})}" class="btn btn-outline" style="min-height:30px; padding:4px 10px; font-size:12px; white-space: nowrap;">Sửa</a>
                                        <a th:href="@{/de-tai/chi-tiet/{maDeTai}(maDeTai=${dt.maDeTai})}" class="btn btn-outline" style="min-height:30px; padding:4px 10px; font-size:12px; white-space: nowrap;">Phân công GV</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </main>
</div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
