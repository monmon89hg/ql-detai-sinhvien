<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Danh sách đề tài')}"></head>
<body>
<a class="skip" href="#content">Bỏ qua điều hướng</a>
<div th:replace="~{fragments/header :: header}"></div>
<div class="backdrop"></div>

<div class="app-grid">
    <div th:replace="~{fragments/sidebar :: sidebar('topics')}"></div>

    <main class="page" id="content">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb('Danh sách đề tài')}"></div>

        <div class="container">
            <div th:replace="~{fragments/messages :: messages}"></div>

            <div class="page-heading" style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h1>Danh sách đề tài nghiên cứu</h1>
                </div>
                <div style="display:flex; gap:10px;">
                    <a th:if="${selectedMaDot != null and !selectedMaDot.isEmpty()}" th:href="@{/dot-dang-ky/{maDot}/lich.ics(maDot=${selectedMaDot})}" class="btn btn-outline">📅 Lịch đợt này (.ics)</a>
                    <a th:href="@{/de-tai/de-xuat}" class="btn btn-primary" sec:authorize="hasAnyRole('GIANG_VIEN', 'TRUONG_BO_MON')">+ Đề xuất đề tài mới</a>
                </div>
            </div>

            <!-- BỘ LỌC TÌM KIẾM -->
            <div class="placeholder" style="max-width: 100%; margin-bottom: 20px; padding: 20px;">
                <form th:action="@{/de-tai}" method="get" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) 120px; gap: 12px; align-items: end;">
                    <div class="form-field" style="margin: 0;">
                        <label>Đợt đăng ký</label>
                        <select name="maDot" class="form-control">
                            <option value="">-- Tất cả đợt --</option>
                            <option th:each="d : ${dots}" th:value="${d.maDot}" th:text="${d.tenDot}" th:selected="${d.maDot == selectedMaDot}"></option>
                        </select>
                    </div>

                    <div class="form-field" style="margin: 0;">
                        <label>Trạng thái</label>
                        <select name="trangThai" class="form-control">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option value="CHO_DUYET" th:selected="${selectedTrangThai == 'CHO_DUYET'}">Chờ duyệt</option>
                            <option value="DA_DUYET" th:selected="${selectedTrangThai == 'DA_DUYET'}">Đã duyệt</option>
                            <option value="CONG_BO" th:selected="${selectedTrangThai == 'CONG_BO'}">Đã công bố (SV xem)</option>
                            <option value="NGUNG_NHAN" th:selected="${selectedTrangThai == 'NGUNG_NHAN'}">Ngừng nhận đăng ký</option>
                            <option value="TU_CHOI" th:selected="${selectedTrangThai == 'TU_CHOI'}">Bị từ chối</option>
                        </select>
                    </div>

                    <div class="form-field" style="margin: 0;">
                        <label>Từ khóa tìm kiếm</label>
                        <input type="text" name="keyword" class="form-control" placeholder="Tên hoặc mã đề tài..." th:value="${keyword}">
                    </div>

                    <button type="submit" class="btn btn-primary" style="height: 42px;">Tìm kiếm</button>
                </form>
            </div>

            <!-- BẢNG ĐỀ TÀI -->
            <div class="placeholder" style="max-width: 100%;">
                <div class="table-responsive">
                    <table class="data-table" style="vertical-align: middle;">
                        <thead>
                            <tr>
                                <th style="text-align: center; white-space: nowrap;">Mã đề tài</th>
                                <th style="text-align: left;">Tên đề tài</th>
                                <th style="text-align: center; white-space: nowrap;">Mã đợt</th>
                                <th style="text-align: center; white-space: nowrap;">Trạng thái</th>
                                <th style="text-align: center; white-space: nowrap;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(deTais)}">
                                <td colspan="5" style="text-align:center; padding: 32px 20px; color:#557085; font-size: 13.5px;">
                                    Không có đề tài nào phù hợp với bộ lọc tìm kiếm.
                                </td>
                            </tr>
                            <tr th:each="dt : ${deTais}" style="vertical-align: middle;">
                                <td style="text-align: center; white-space: nowrap;">
                                    <strong th:text="${dt.maDeTai}">DT001</strong>
                                </td>
                                <td>
                                    <strong th:text="${dt.tenDeTai}">Hệ thống nhận diện biển số xe</strong>
                                </td>
                                <td style="text-align: center; white-space: nowrap;">
                                    <span th:text="${dt.maDot}">DOT-01</span>
                                </td>
                                <td style="text-align: center; white-space: nowrap;">
                                    <span style="white-space: nowrap; font-weight: 600;"
                                          th:style="${dt.trangThai == 'CONG_BO' ? 'color:#18794e;' : (dt.trangThai == 'TU_CHOI' ? 'color:#b3261e;' : (dt.trangThai == 'DA_DUYET' ? 'color:#0369a1;' : (dt.trangThai == 'CHO_DUYET' ? 'color:#d97706;' : (dt.trangThai == 'NGUNG_NHAN' ? 'color:#4b5563;' : 'color:#475569;'))))}"
                                          th:text="${dt.tenTrangThaiHienThi}">Đã công bố</span>
                                </td>
                                <td style="text-align: center;">
                                    <div class="btn-row" style="justify-content: center; gap: 6px; flex-wrap: nowrap;">
                                        <a th:href="@{/de-tai/chi-tiet/{maDeTai}(maDeTai=${dt.maDeTai})}" class="btn btn-outline" style="min-height:28px; padding:3px 8px; font-size:12px; white-space: nowrap;">Chi tiết</a>
                                        <a th:if="${dt.trangThai != 'NGUNG_NHAN'}" th:href="@{/de-tai/sua/{maDeTai}(maDeTai=${dt.maDeTai})}" class="btn btn-outline" style="min-height:28px; padding:3px 8px; font-size:12px; white-space: nowrap;" sec:authorize="hasAnyRole('GIANG_VIEN', 'TRUONG_BO_MON', 'TRUONG_KHOA')">Sửa</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </main>
</div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
