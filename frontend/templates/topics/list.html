<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Danh sách đề tài')}"></head>
<body>
<a class="skip" href="#content">Bỏ qua điều hướng</a>
<div th:replace="~{fragments/header :: header}"></div>
<div class="backdrop"></div>

<div class="app-grid">
    <div th:replace="~{fragments/sidebar :: sidebar('topics')}"></div>

    <main class="page" id="content">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb('Danh sách đề tài')}"></div>

        <div class="container">
            <div th:replace="~{fragments/messages :: messages}"></div>

            <div class="page-heading" style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h1>Danh sách đề tài nghiên cứu</h1>
                </div>
                <div style="display:flex; gap:10px;">
                    <a th:if="${selectedMaDot != null and !selectedMaDot.isEmpty()}" th:href="@{/dot-dang-ky/{maDot}/lich.ics(maDot=${selectedMaDot})}" class="btn btn-outline" style="color:#1a73e8; border-color:#1a73e8;">📅 Lịch đợt này (.ics)</a>
                    <a th:href="@{/de-tai/de-xuat}" class="btn btn-primary">+ Đề xuất đề tài mới</a>
                </div>
            </div>

            <!-- BỘ LỌC TÌM KIẾM -->
            <div class="placeholder" style="max-width: 100%; margin-bottom: 20px; padding: 20px;">
                <form th:action="@{/de-tai}" method="get" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) 120px; gap: 12px; align-items: end;">
                    <div class="form-field" style="margin: 0;">
                        <label>Đợt đăng ký</label>
                        <select name="maDot" class="form-control">
                            <option value="">-- Tất cả đợt --</option>
                            <option th:each="d : ${dots}" th:value="${d.maDot}" th:text="${d.tenDot}" th:selected="${d.maDot == selectedMaDot}"></option>
                        </select>
                    </div>

                    <div class="form-field" style="margin: 0;">
                        <label>Trạng thái</label>
                        <select name="trangThai" class="form-control">
                            <option value="">-- Tất cả trạng thái --</option>
                            <option value="CHO_DUYET" th:selected="${selectedTrangThai == 'CHO_DUYET'}">Chờ duyệt</option>
                            <option value="DA_DUYET" th:selected="${selectedTrangThai == 'DA_DUYET'}">Đã duyệt</option>
                            <option value="CONG_BO" th:selected="${selectedTrangThai == 'CONG_BO'}">Đã công bố (SV xem)</option>
                            <option value="NGUNG_NHAN" th:selected="${selectedTrangThai == 'NGUNG_NHAN'}">Ngừng nhận đăng ký</option>
                            <option value="TU_CHOI" th:selected="${selectedTrangThai == 'TU_CHOI'}">Bị từ chối</option>
                        </select>
                    </div>

                    <div class="form-field" style="margin: 0;">
                        <label>Từ khóa tìm kiếm</label>
                        <input type="text" name="keyword" class="form-control" placeholder="Tên hoặc mã đề tài..." th:value="${keyword}">
                    </div>

                    <button type="submit" class="btn btn-primary" style="height: 42px;">Tìm kiếm</button>
                </form>
            </div>

            <!-- BẢNG ĐỀ TÀI -->
            <div class="placeholder" style="max-width: 100%;">
                <table class="data-table" style="vertical-align: middle;">
                    <thead>
                        <tr>
                            <th style="text-align: center; width: 120px;">Mã đề tài</th>
                            <th style="text-align: center; min-width: 250px;">Tên đề tài</th>
                            <th style="text-align: center; width: 130px;">Mã đợt</th>
                            <th style="text-align: center; width: 140px;">Trạng thái</th>
                            <th style="text-align: center; width: 150px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(deTais)}">
                            <td colspan="5" style="text-align:center; padding: 25px; color:#869bab;">
                                Không có đề tài nào phù hợp với bộ lọc tìm kiếm.
                            </td>
                        </tr>
                        <tr th:each="dt : ${deTais}" style="vertical-align: middle;">
                            <td style="text-align: center;">
                                <strong class="route-line" style="white-space: nowrap; display: inline-block;" th:text="${dt.maDeTai}">DT001</strong>
                            </td>
                            <td>
                                <strong th:text="${dt.tenDeTai}">Hệ thống nhận diện biển số xe</strong>
                            </td>
                            <td style="text-align: center;">
                                <span class="status-pill" style="white-space: nowrap; display: inline-block;" th:text="${dt.maDot}">DOT-01</span>
                            </td>
                            <td style="text-align: center; white-space: nowrap;">
                                <span class="status-pill"
                                      style="white-space: nowrap; display: inline-block; padding: 4px 10px;"
                                      th:style="${dt.trangThai == 'CONG_BO' ? 'background:#e6f9f0; color:#18794e; white-space:nowrap; display:inline-block; padding:4px 10px;' : (dt.trangThai == 'TU_CHOI' ? 'background:#fdeeee; color:#b3261e; white-space:nowrap; display:inline-block; padding:4px 10px;' : (dt.trangThai == 'DA_DUYET' ? 'background:#e0f2fe; color:#0369a1; white-space:nowrap; display:inline-block; padding:4px 10px;' : (dt.trangThai == 'CHO_DUYET' ? 'background:#fef3c7; color:#92400e; white-space:nowrap; display:inline-block; padding:4px 10px;' : (dt.trangThai == 'NGUNG_NHAN' ? 'background:#f3f4f6; color:#4b5563; white-space:nowrap; display:inline-block; padding:4px 10px;' : 'background:#f1f5f9; color:#475569; white-space:nowrap; display:inline-block; padding:4px 10px;'))))}"
                                      th:text="${dt.tenTrangThaiHienThi}">Đã công bố</span>
                            </td>
                            <td style="text-align: center;">
                                <div class="btn-row" style="justify-content: center; gap: 6px; flex-wrap: nowrap;">
                                    <a th:href="@{/de-tai/chi-tiet/{maDeTai}(maDeTai=${dt.maDeTai})}" class="btn btn-outline" style="min-height:28px; padding:3px 8px; font-size:12px; white-space: nowrap;">Chi tiết</a>
                                    <a th:if="${dt.trangThai != 'NGUNG_NHAN'}" th:href="@{/de-tai/sua/{maDeTai}(maDeTai=${dt.maDeTai})}" class="btn btn-outline" style="min-height:28px; padding:3px 8px; font-size:12px; white-space: nowrap;">Sửa</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </main>
</div>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
