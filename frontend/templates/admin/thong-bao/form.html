<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${isEdit} ? 'Sửa thông báo' : 'Tạo thông báo')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="app-grid">
    <aside th:replace="~{fragments/sidebar :: sidebar('announcements')}"></aside>

    <main class="page" id="content">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb('Quản lý thông báo')}"></div>

        <section class="page-heading">
            <div>
                <h1 th:text="${isEdit} ? 'Sửa bản nháp' : 'Tạo thông báo'"></h1>
                <p>Thông báo được lưu dưới dạng bản nháp cho đến khi công bố.</p>
            </div>
            <a class="btn btn-outline" th:href="@{/thong-bao/quan-ly}">
                Quay lại danh sách
            </a>
        </section>

        <div th:replace="~{fragments/messages :: messages}"></div>

        <section class="card">
            <form th:object="${form}"
                  th:action="${isEdit}
                      ? @{/thong-bao/quan-ly/{id}(id=${maThongBao})}
                      : @{/thong-bao/quan-ly}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div th:if="${#fields.hasGlobalErrors()}" class="form-error">
                    <p th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}"></p>
                </div>

                <div th:if="${!isEdit}" class="form-group">
                    <label for="maThongBao">Mã thông báo</label>
                    <input id="maThongBao"
                           type="text"
                           th:field="*{maThongBao}"
                           maxlength="30"
                           required>
                    <small class="form-error"
                           th:errors="*{maThongBao}"></small>
                </div>

                <div class="form-group">
                    <label for="tieuDe">Tiêu đề</label>
                    <input id="tieuDe"
                           type="text"
                           th:field="*{tieuDe}"
                           maxlength="200"
                           required>
                    <small class="form-error"
                           th:errors="*{tieuDe}"></small>
                </div>

                <div class="form-group">
                    <label for="noiDung">Nội dung</label>
                    <textarea id="noiDung"
                              th:field="*{noiDung}"
                              rows="8"
                              required></textarea>
                    <small class="form-error"
                           th:errors="*{noiDung}"></small>
                </div>

                <div class="form-group">
                    <label for="phamVi">Phạm vi nhận thông báo</label>
                    <select id="phamVi" th:field="*{phamVi}" required>
                        <option value="TAT_CA">Tất cả người dùng</option>
                        <option value="CA_NHAN">Thông báo cá nhân (chọn người nhận)</option>
                    </select>
                    <small class="form-error"
                           th:errors="*{phamVi}"></small>
                </div>

                <div class="form-group" id="recipientGroup"
                     th:style="${form.phamVi == 'CA_NHAN'} ? 'display:block' : 'display:none'">
                    <label for="maNguoiNhan">Người nhận</label>
                    <select id="maNguoiNhan"
                            th:field="*{maNguoiNhan}"
                            multiple
                            size="8">
                        <option th:each="nguoiNhan : ${danhSachNguoiNhan}"
                                th:value="${nguoiNhan.maNguoiDung}"
                                th:text="${nguoiNhan.hoTen + ' — ' + (nguoiNhan.loaiNguoiDung == 'CAN_BO' ? 'TRƯỞNG KHOA' : nguoiNhan.loaiNguoiDung) + ' (' + nguoiNhan.maNguoiDung + ')'}">
                        </option>
                    </select>
                    <small>Giữ Ctrl (Windows) hoặc Command (Mac) để chọn nhiều tài khoản.</small>
                    <small class="form-error" th:errors="*{maNguoiNhan}"></small>
                </div>

                <div class="form-group">
                    <label for="maDot">Mã đợt đăng ký (không bắt buộc)</label>
                    <input id="maDot"
                           type="text"
                           th:field="*{maDot}"
                           maxlength="30">
                    <small class="form-error"
                           th:errors="*{maDot}"></small>
                </div>

                <div class="form-actions">
                    <button type="submit"
                            class="btn btn-primary"
                            th:text="${isEdit} ? 'Lưu bản nháp' : 'Tạo bản nháp'">
                    </button>
                    <a class="btn btn-outline" th:href="@{/thong-bao/quan-ly}">
                        Hủy
                    </a>
                </div>
            </form>
        </section>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const scope = document.getElementById("phamVi");
        const group = document.getElementById("recipientGroup");
        const recipients = document.getElementById("maNguoiNhan");

        const updateRecipientVisibility = () => {
            const personal = scope.value === "CA_NHAN";
            group.style.display = personal ? "block" : "none";
            recipients.required = personal;
        };

        scope.addEventListener("change", updateRecipientVisibility);
        updateRecipientVisibility();
    });
</script>
</body>
</html>
