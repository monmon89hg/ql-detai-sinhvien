<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${isEdit} ? 'Sửa bộ môn' : 'Thêm bộ môn')}"></head>
<body>
<style>
    /* Styles are scoped to this form so other Base UI pages are unaffected. */
    .department-form-card {
        max-width: 1080px;
        padding: 28px 30px;
        background: #fff;
        border: 1px solid #e1e7ed;
        border-radius: 8px;
    }

    .department-form {
        width: 100%;
    }

    .department-form .form-group {
        display: grid;
        grid-template-columns: minmax(210px, 250px) minmax(0, 1fr);
        align-items: start;
        column-gap: 26px;
        row-gap: 8px;
        margin: 0 0 22px;
    }

    .department-form .form-group > label {
        grid-column: 1;
        padding-top: 12px;
        color: #293b4d;
        font-weight: 500;
    }

    .department-form .form-group > input,
    .department-form .form-group > textarea {
        grid-column: 2;
        width: 100%;
        min-height: 46px;
        padding: 10px 13px;
        color: #263747;
        background: #fff;
        border: 1px solid #cfd7df;
        border-radius: 4px;
        font: inherit;
        box-sizing: border-box;
    }

    .department-form .form-group > textarea {
        min-height: 140px;
        resize: vertical;
    }

    .department-form .form-group > input:focus,
    .department-form .form-group > textarea:focus {
        border-color: #2b719b;
        outline: 3px solid rgb(43 113 155 / 14%);
    }

    .department-form .form-group > small {
        grid-column: 2;
        margin: 0;
    }

    .department-form .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid #e6ebef;
    }

    @media (max-width: 700px) {
        .department-form-card {
            padding: 20px 16px;
        }

        .department-form .form-group {
            grid-template-columns: minmax(0, 1fr);
            row-gap: 7px;
        }

        .department-form .form-group > label,
        .department-form .form-group > input,
        .department-form .form-group > textarea,
        .department-form .form-group > small {
            grid-column: 1;
        }

        .department-form .form-group > label {
            padding-top: 0;
        }

        .department-form .form-actions > * {
            flex: 1;
            text-align: center;
        }
    }
</style>
<div th:replace="~{fragments/header :: header}"></div>

<div class="app-grid">
    <aside th:replace="~{fragments/sidebar :: sidebar('departments')}"></aside>

    <main class="page" id="content">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb('Quản lý bộ môn')}"></div>

        <section class="page-heading">
            <div>
                <h1 th:text="${isEdit} ? 'Sửa bộ môn' : 'Thêm bộ môn'"></h1>
                <p>Nhập thông tin bộ môn.</p>
            </div>
            <a class="btn btn-outline" th:href="@{/admin/bo-mon}">
                Quay lại danh sách
            </a>
        </section>

        <div th:replace="~{fragments/messages :: messages}"></div>

        <section class="card department-form-card">
            <form th:object="${form}"
                  class="department-form"
                  th:action="${isEdit}
                      ? @{/admin/bo-mon/{maBoMon}(maBoMon=${maBoMon})}
                      : @{/admin/bo-mon}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div th:if="${#fields.hasGlobalErrors()}" class="form-error">
                    <p th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}"></p>
                </div>

                <div th:if="${!isEdit}" class="form-group">
                    <label for="maBoMon">Mã bộ môn</label>
                    <input id="maBoMon"
                           type="text"
                           th:field="*{maBoMon}"
                           maxlength="20"
                           required>
                    <small class="form-error"
                           th:errors="*{maBoMon}"></small>
                </div>

                <div class="form-group">
                    <label for="tenBoMon">Tên bộ môn</label>
                    <input id="tenBoMon"
                           type="text"
                           th:field="*{tenBoMon}"
                           maxlength="150"
                           required>
                    <small class="form-error"
                           th:errors="*{tenBoMon}"></small>
                </div>

                <div class="form-group">
                    <label for="moTa">Mô tả</label>
                    <textarea id="moTa"
                              th:field="*{moTa}"
                              rows="4"
                              maxlength="500"></textarea>
                    <small class="form-error"
                           th:errors="*{moTa}"></small>
                </div>

                <div class="form-actions">
                    <button type="submit"
                            class="btn btn-primary"
                            th:text="${isEdit} ? 'Lưu thay đổi' : 'Tạo bộ môn'">
                    </button>
                    <a class="btn btn-outline" th:href="@{/admin/bo-mon}">
                        Hủy
                    </a>
                </div>
            </form>
        </section>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>
</div>
</body>
</html>
