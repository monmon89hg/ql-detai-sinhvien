<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${isEdit} ? 'Sửa tài khoản' : 'Thêm tài khoản')}"></head>
<body>
<style>
    /* Styles are scoped to the account form; shared Base UI styles remain unchanged. */
    .account-form-card {
        max-width: 1080px;
        padding: 28px 30px;
        background: #fff;
        border: 1px solid #e1e7ed;
        border-radius: 8px;
    }

    .account-form {
        width: 100%;
    }

    .account-form .form-group:not(.account-form-roles) {
        display: grid;
        grid-template-columns: minmax(210px, 250px) minmax(0, 1fr);
        align-items: center;
        column-gap: 26px;
        row-gap: 8px;
        margin: 0 0 22px;
    }

    .account-form .form-group:not(.account-form-roles) > label {
        grid-column: 1;
        margin: 0;
        color: #293b4d;
        font-weight: 500;
    }

    .account-form .form-group:not(.account-form-roles) > input,
    .account-form .form-group:not(.account-form-roles) > select {
        grid-column: 2;
        width: 100%;
        min-height: 46px;
        padding: 10px 13px;
        color: #263747;
        background: #fff;
        border: 1px solid #cfd7df;
        border-radius: 4px;
        font: inherit;
        box-sizing: border-box;
    }

    .account-form .form-group:not(.account-form-roles) > input:focus,
    .account-form .form-group:not(.account-form-roles) > select:focus {
        border-color: #2b719b;
        outline: 3px solid rgb(43 113 155 / 14%);
    }

    .account-form .form-group:not(.account-form-roles) > small {
        grid-column: 2;
        margin: 0;
    }

    .account-form-roles {
        margin: 0 0 22px;
        padding: 16px 18px;
        border: 1px solid #d8e0e7;
        border-radius: 4px;
    }

    .account-form-roles legend {
        padding: 0 6px;
        color: #293b4d;
        font-weight: 600;
    }

    .account-form-roles .checkbox-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 6px 18px 6px 0;
    }

    .account-form-roles input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
    }

    .account-form .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid #e6ebef;
    }

    @media (max-width: 700px) {
        .account-form-card {
            padding: 20px 16px;
        }

        .account-form .form-group:not(.account-form-roles) {
            grid-template-columns: minmax(0, 1fr);
            row-gap: 7px;
        }

        .account-form .form-group:not(.account-form-roles) > label,
        .account-form .form-group:not(.account-form-roles) > input,
        .account-form .form-group:not(.account-form-roles) > select,
        .account-form .form-group:not(.account-form-roles) > small {
            grid-column: 1;
        }

        .account-form .form-actions {
            justify-content: stretch;
        }

        .account-form .form-actions > * {
            flex: 1;
            text-align: center;
        }
    }
</style>
<div th:replace="~{fragments/header :: header}"></div>

<div class="app-grid">
    <aside th:replace="~{fragments/sidebar :: sidebar('users')}"></aside>

    <main class="page" id="content">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb('Quản lý tài khoản')}"></div>

        <section class="page-heading">
            <div>
                <h1 th:text="${isEdit} ? 'Sửa tài khoản' : 'Thêm tài khoản'"></h1>
                <p>Cập nhật thông tin tài khoản người dùng.</p>
            </div>
            <a class="btn btn-outline" th:href="@{/admin/users}">
                Quay lại danh sách
            </a>
        </section>

        <div th:replace="~{fragments/messages :: messages}"></div>

        <section class="card account-form-card">
            <form th:object="${form}"
                  class="account-form"
                  th:action="${isEdit}
                      ? @{/admin/users/{id}(id=${maNguoiDung})}
                      : @{/admin/users}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div th:if="${#fields.hasGlobalErrors()}" class="form-error">
                    <p th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}">
                    </p>
                </div>

                <div th:if="${!isEdit}" class="form-group">
                    <label for="maNguoiDung">Mã người dùng</label>
                    <input id="maNguoiDung"
                           type="text"
                           th:field="*{maNguoiDung}"
                           maxlength="30"
                           required>
                    <small class="form-error"
                           th:errors="*{maNguoiDung}"></small>
                </div>

                <div class="form-group">
                    <label for="hoTen">Họ và tên</label>
                    <input id="hoTen"
                           type="text"
                           th:field="*{hoTen}"
                           maxlength="100"
                           required>
                    <small class="form-error"
                           th:errors="*{hoTen}"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email"
                           type="email"
                           th:field="*{email}"
                           maxlength="120"
                           required>
                    <small class="form-error"
                           th:errors="*{email}"></small>
                </div>

                <div th:if="${!isEdit}" class="form-group">
                    <label for="matKhau">Mật khẩu</label>
                    <input id="matKhau"
                           type="password"
                           th:field="*{matKhau}"
                           minlength="8"
                           maxlength="72"
                           autocomplete="new-password"
                           required>
                    <small class="form-error"
                           th:errors="*{matKhau}"></small>
                    <small>Mật khẩu phải dài từ 8 đến 72 ký tự.</small>
                </div>

                <div th:if="${!isEdit}" class="form-group">
                    <label for="loaiNguoiDung">Loại người dùng</label>
                    <select id="loaiNguoiDung"
                            th:field="*{loaiNguoiDung}"
                            required>
                        <option value="">-- Chọn loại người dùng --</option>
                        <option value="SV">Sinh viên</option>
                        <option value="GV">Giảng viên</option>
                        <option value="CAN_BO">Cán bộ</option>
                    </select>
                    <small class="form-error"
                           th:errors="*{loaiNguoiDung}"></small>
                </div>

                <div class="form-group">
                    <label for="maBoMon">Bộ môn</label>
                    <select id="maBoMon" th:field="*{maBoMon}">
                        <option value="">-- Không chọn bộ môn --</option>
                        <option th:each="boMon : ${boMons}"
                                th:value="${boMon.maBoMon}"
                                th:text="${boMon.tenBoMon}">
                        </option>
                    </select>
                    <small class="form-error"
                           th:errors="*{maBoMon}"></small>
                </div>

                <div class="form-group">
                    <label for="soDienThoai">Số điện thoại</label>
                    <input id="soDienThoai"
                           type="tel"
                           th:field="*{soDienThoai}"
                           maxlength="20">
                    <small class="form-error"
                           th:errors="*{soDienThoai}"></small>
                </div>

                <div class="form-group">
                    <label for="lopHanhChinh">Lớp hành chính</label>
                    <input id="lopHanhChinh"
                           type="text"
                           th:field="*{lopHanhChinh}"
                           maxlength="50">
                    <small class="form-error"
                           th:errors="*{lopHanhChinh}"></small>
                </div>

                <fieldset th:if="${!isEdit}" class="form-group account-form-roles">
                    <legend>Vai trò</legend>

                    <label th:each="vaiTro : ${vaiTros}" class="checkbox-label">
                        <input type="checkbox"
                               th:field="*{maVaiTros}"
                               th:value="${vaiTro.maVaiTro}">
                        <span th:text="${vaiTro.tenVaiTro}"></span>
                    </label>

                    <small class="form-error"
                           th:errors="*{maVaiTros}"></small>
                </fieldset>

                <div class="form-actions">
                    <button type="submit"
                            class="btn btn-primary"
                            th:text="${isEdit} ? 'Lưu thay đổi' : 'Tạo tài khoản'">
                    </button>
                    <a class="btn btn-outline" th:href="@{/admin/users}">
                        Hủy
                    </a>
                </div>
            </form>
        </section>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>
</div>
</body>
</html>
