<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập')}"></head>
<body class="login-page">
<main class="login-shell">
    <header class="login-brand">
        <img src="/images/ute_logo.png"
             th:src="@{/images/ute_logo.png}"
             alt="Logo HCM-UTE"
             class="login-logo">
        <h2>TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT TP.HCM</h2>
    </header>

    <section class="login-card">
        <header class="login-card-heading">
            <h1>ĐĂNG NHẬP</h1>
        </header>

        <p th:if="${param.error}" class="message message-error">
            Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.
        </p>
        <p th:if="${param.logout}" class="message message-success">
            Bạn đã đăng xuất.
        </p>

        <form th:action="@{/login}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-field login-field">
                <label for="email">Email</label>
                <input id="email"
                       name="email"
                       type="email"
                       placeholder="Nhập email"
                       autocomplete="username"
                       required>
            </div>

            <div class="form-field login-field">
                <label for="matKhau">Mật khẩu</label>
                <div class="login-password-wrap">
                    <input id="matKhau"
                           name="matKhau"
                           type="password"
                           placeholder="Nhập mật khẩu"
                           autocomplete="current-password"
                           required>
                    <button class="password-toggle" type="button"
                            aria-controls="matKhau" aria-pressed="false"
                            title="Hiện mật khẩu"
                            onclick="togglePasswordVisibility(this)">
                        <!-- Icon Mắt mở (khi mật khẩu đang ẩn) -->
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- Icon Mắt gạch chéo (khi mật khẩu đang hiện) -->
                        <svg class="icon-eye-slash" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button class="login-submit" type="submit">Đăng nhập</button>
        </form>
    </section>
</main>
<script>
    function togglePasswordVisibility(button) {
        const input = document.getElementById(button.getAttribute('aria-controls'));
        const isShowing = input.type === 'text';
        const nextShowing = !isShowing;
        input.type = nextShowing ? 'text' : 'password';
        button.setAttribute('aria-pressed', String(nextShowing));
        button.setAttribute('title', nextShowing ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    }
</script>
</body>
</html>
