<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập')}"></head>

<body class="login-page">
<main class="login-container">
    <section class="login-card">
        <h1>Đăng nhập</h1>

        <p th:if="${param.error}" class="message message-error">
            Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.
        </p>

        <p th:if="${param.logout}" class="message message-success">
            Bạn đã đăng xuất.
        </p>

        <form th:action="@{/login}" method="post">
            <div class="form-field">
                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-field">
                <label for="matKhau">Mật khẩu</label>
                <input
                    id="matKhau"
                    name="matKhau"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">Đăng nhập</button>
        </form>
    </section>
</main>
</body>
</html>
