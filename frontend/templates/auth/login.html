<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập')}"></head>
<body class="login-page">
<main class="login-shell">
    <header class="login-brand">
        <img src="/images/ute_logo.png"
             th:src="@{/images/ute_logo.png}"
             alt="Logo HCM-UTE"
             class="login-logo">
        <h2>TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT TP.HCM</h2>
    </header>

    <section class="login-card">
        <header class="login-card-heading">
            <h1>ĐĂNG NHẬP</h1>
        </header>

        <p th:if="${param.error}" class="message message-error">
            Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.
        </p>
        <p th:if="${param.logout}" class="message message-success">
            Bạn đã đăng xuất.
        </p>

        <form th:action="@{/login}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-field login-field">
                <label for="email">Email</label>
                <input id="email"
                       name="email"
                       type="email"
                       placeholder="Nhập email"
                       autocomplete="username"
                       required>
            </div>

            <div class="form-field login-field">
                <label for="matKhau">Mật khẩu</label>
                <div class="login-password-wrap">
                    <input id="matKhau"
                           name="matKhau"
                           type="password"
                           placeholder="Nhập mật khẩu"
                           autocomplete="current-password"
                           required>
                    <button class="password-toggle" type="button"
                            aria-controls="matKhau" aria-pressed="false"
                            onclick="togglePasswordVisibility(this)">Hiện</button>
                </div>
            </div>

            <button class="login-submit" type="submit">Đăng nhập</button>
        </form>
    </section>
</main>
<script>
    function togglePasswordVisibility(button) {
        const input = document.getElementById(button.getAttribute('aria-controls'));
        const showPassword = input.type === 'password';
        input.type = showPassword ? 'text' : 'password';
        button.textContent = showPassword ? 'Ẩn' : 'Hiện';
        button.setAttribute('aria-pressed', String(showPassword));
    }
</script>
</body>
</html>
