<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập')}"></head>

<body class="login-page">
<main class="login-shell">
    <header class="login-brand">
        <img src="/images/ute_logo.png"
             th:src="@{/images/ute_logo.png}"
             alt="Logo HCM-UTE"
             class="login-logo">

        <h2>TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT TP.HCM</h2>
    </header>

    <section class="login-card">
        <h1>Đăng nhập</h1>

        <p th:if="${param.error}" class="message message-error">
            Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.
        </p>

        <p th:if="${param.logout}" class="message message-success">
            Bạn đã đăng xuất.
        </p>

        <form th:action="@{/login}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-field">
                <label for="email" class="visually-hidden">Tên đăng nhập</label>
                <input id="email"
                       name="email"
                       type="email"
                       placeholder="Tên đăng nhập"
                       autocomplete="username"
                       required>
            </div>

            <div class="form-field">
                <label for="matKhau" class="visually-hidden">Mật khẩu</label>
                <input id="matKhau"
                       name="matKhau"
                       type="password"
                       placeholder="Mật khẩu"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit">Đăng nhập</button>
        </form>
    </section>
</main>
</body>
</html>
