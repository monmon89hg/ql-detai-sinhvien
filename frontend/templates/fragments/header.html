<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <body>
        <header class="site-header" th:fragment="header">
            <button
                class="menu-toggle"
                type="button"
                data-menu-toggle
                aria-label="Mở menu"
                aria-expanded="false"
                aria-controls="main-navigation"
            >
                <svg
                    class="icon"
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M4 7h16M4 12h16M4 17h16"/>
                </svg>
            </button>
            <a href="/dashboard" th:href="@{/dashboard}" class="brand" aria-label="Hệ thống quản lý đề tài Khoa CNTT - Trang chủ">
                <span class="brand-mark">
                    <img
                        src="/images/ute_logo.png"
                        th:src="@{/images/ute_logo.png}"
                        alt="Logo HCMUTE"
                        width="40"
                        height="50"
                    >
                </span>
                <span>
                    <span class="brand-name">HỆ THỐNG QUẢN LÝ ĐỀ TÀI KHOA CNTT</span>
                    <br>
                    <span class="brand-desc">Trường Đại học Công nghệ Kỹ thuật TP.HCM</span>
                </span>
            </a>
            <div class="header-spacer"></div>
            <div class="header-account">
                <span class="avatar">
                    <svg
                        class="icon"
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 22a8 8 0 0 1 16 0"/>
                    </svg>
                </span>
                <span class="account-details">
                    <strong th:text="${@userAdvice.resolveName(currentUserName)}">Tài khoản</strong>
                    <span>Truy cập hệ thống</span>
                </span>
                
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <input type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">
                    <button type="submit" class="logout-button">Đăng xuất</button>
                </form>
            </div>
        </header>
    </body>
</html>
