<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <body>
        <header class="site-header" th:fragment="header">
            <button
                class="menu-toggle"
                type="button"
                data-menu-toggle
                aria-label="Mở menu"
                aria-expanded="false"
                aria-controls="main-navigation"
            >
                <svg
                    class="icon"
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M4 7h16M4 12h16M4 17h16"/>
                </svg>
            </button>
            <a href="/dashboard" th:href="@{/dashboard}" class="brand" aria-label="QLĐT Khoa CNTT - Trang chủ">
                <span class="brand-mark">
                    <img
                        src="/images/ute_logo.png"
                        th:src="@{/images/ute_logo.png}"
                        alt="Logo HCMUTE"
                        width="40"
                        height="50"
                    >
                </span>
                <span>
                    <span class="brand-name">QLĐT KHOA CNTT</span>
                    <br>
                    <span class="brand-desc">Hệ thống quản lý đề tài sinh viên</span>
                </span>
            </a>
            <div class="header-spacer"></div>
            <div class="header-account">
                <span class="avatar">
                    <svg
                        class="icon"
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 22a8 8 0 0 1 16 0"/>
                    </svg>
                </span>
                <span class="account-details">
                    <strong th:text="${currentUserName ?: 'Tài khoản'}">Tài khoản</strong>
                    <span>Truy cập hệ thống</span>
                </span>
            </div>
        </header>
    </body>
</html>
