<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Thông báo')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="app-grid">
    <aside th:replace="~{fragments/sidebar :: sidebar('announcements')}"></aside>

    <main class="page" id="content">
        <div th:replace="~{fragments/breadcrumb :: breadcrumb('Thông báo')}"></div>

        <section class="notice-heading">
            <h1>THÔNG BÁO</h1>
        </section>

        <section class="notice-panel">
            <div class="notice-tabs" role="tablist" aria-label="Loại thông báo">
                <button type="button"
                        class="notice-tab is-active"
                        data-notice-tab="CHUNG"
                        role="tab"
                        aria-selected="true">
                    THÔNG BÁO CHUNG
                </button>
                <button type="button"
                        class="notice-tab"
                        data-notice-tab="CA_NHAN"
                        role="tab"
                        aria-selected="false">
                    THÔNG BÁO CÁ NHÂN
                </button>
            </div>

            <label class="notice-search">
                <span aria-hidden="true">⌕</span>
                <input id="noticeSearch"
                       type="search"
                       placeholder="Tìm kiếm thông báo"
                       aria-label="Tìm kiếm thông báo">
            </label>

            <div class="notice-table-wrap">
                <table class="notice-table">
                    <thead>
                    <tr>
                        <th>Tiêu đề</th>
                        <th>Người gửi</th>
                        <th>Thời gian gửi</th>
                    </tr>
                    </thead>

                    <tbody id="noticeRows">
                    <tr th:each="thongBao : ${thongBaos.content}"
                        class="notice-row"
                        th:attr="data-scope=${thongBao.phamVi},
                                 data-search=${thongBao.tieuDe + ' ' + thongBao.tenNguoiDang + ' ' + thongBao.noiDung}">
                        <td>
                            <span class="notice-title" th:text="${thongBao.tieuDe}"></span>
                            <span class="notice-content" th:text="${thongBao.noiDung}"></span>
                        </td>
                        <td th:text="${thongBao.tenNguoiDang}"></td>
                        <td>
                            <time th:if="${thongBao.congBoLuc != null}"
                                  th:datetime="${thongBao.congBoLuc}"
                                  th:text="${#temporals.format(thongBao.congBoLuc, 'dd/MM/yyyy HH:mm:ss')}">
                            </time>
                            <span th:unless="${thongBao.congBoLuc != null}">—</span>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <p id="noticeEmpty"
                   class="notice-empty"
                   th:if="${thongBaos.empty}">
                    Hiện chưa có thông báo nào.
                </p>
                <p id="noticeNoMatch" class="notice-empty" hidden>
                    Không tìm thấy thông báo phù hợp.
                </p>
            </div>

            <nav class="pagination"
                 th:if="${thongBaos.totalPages > 1}"
                 aria-label="Phân trang thông báo">
                <a th:if="${thongBaos.hasPrevious()}"
                   th:href="@{/thong-bao(page=${thongBaos.number - 1})}">
                    Trang trước
                </a>
                <span th:text="|Trang ${thongBaos.number + 1} / ${thongBaos.totalPages}|"></span>
                <a th:if="${thongBaos.hasNext()}"
                   th:href="@{/thong-bao(page=${thongBaos.number + 1})}">
                    Trang sau
                </a>
            </nav>
        </section>

        <div th:replace="~{fragments/footer :: footer}"></div>
    </main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const tabs = document.querySelectorAll("[data-notice-tab]");
        const rows = [...document.querySelectorAll(".notice-row")];
        const searchInput = document.getElementById("noticeSearch");
        const noMatch = document.getElementById("noticeNoMatch");

        let activeTab = "CHUNG";

        const normalize = (text) => text
            .toLocaleLowerCase("vi")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/đ/g, "d");

        const filterRows = () => {
            const query = normalize(searchInput.value.trim());
            let visibleCount = 0;

            rows.forEach((row) => {
                const scope = row.dataset.scope;
                const isGeneral = scope === "TAT_CA";
                const matchesTab = activeTab === "CHUNG"
                    ? isGeneral
                    : !isGeneral;
                const matchesSearch = normalize(row.dataset.search || "").includes(query);
                const visible = matchesTab && matchesSearch;

                row.hidden = !visible;
                if (visible) visibleCount++;
            });

            noMatch.hidden = visibleCount > 0 || rows.length === 0;
        };

        tabs.forEach((tab) => {
            tab.addEventListener("click", () => {
                activeTab = tab.dataset.noticeTab;

                tabs.forEach((item) => {
                    const selected = item === tab;
                    item.classList.toggle("is-active", selected);
                    item.setAttribute("aria-selected", String(selected));
                });

                filterRows();
            });
        });

        searchInput.addEventListener("input", filterRows);
        filterRows();
    });
</script>
</body>
</html>
