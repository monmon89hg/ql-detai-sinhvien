# Chỉ dùng trong test; không đóng gói vào JAR production.
spring.datasource.url=jdbc:mysql://127.0.0.1:${CI_DB_PORT:3306}/qldt_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${CI_DB_USERNAME}
spring.datasource.password=${CI_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
app.ket-qua.email.enabled=false
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.mail.username=
spring.mail.password=
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.test.mockmvc.print=NONE
