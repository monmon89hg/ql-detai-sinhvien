spring.application.name=qldt

# Cấu hình kết nối MySQL (Database ql_detai_sinhvien)
spring.datasource.url=jdbc:mysql://localhost:3306/ql_detai_sinhvien?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tắt Flyway tự động quét và chạy các migration script
spring.flyway.enabled=false

server.port=8081