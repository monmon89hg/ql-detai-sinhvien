spring.application.name=qldt

# Cấu hình kết nối MySQL (Database qldt_local_demo)
spring.datasource.url=jdbc:mysql://localhost:3306/qldt_local_demo?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Admin@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate (Không tự động can thiệp sửa bảng)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Bật Flyway tự động khởi tạo bảng V1-V5
spring.flyway.enabled=true

# Port máy chủ web
server.port=8081