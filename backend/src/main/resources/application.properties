spring.application.name=qldt

# Cấu hình kết nối MySQL (Database ql_detai_sinhvien)
spring.datasource.url=jdbc:mysql://localhost:3306/ql_detai_sinhvien?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tắt Flyway tự động quét và chạy các migration script
spring.flyway.enabled=false

server.port=8081

# Chỉ gửi email kết quả khi chủ động bật và cung cấp cấu hình SMTP.
app.ket-qua.email.enabled=${RESULT_EMAIL_ENABLED:false}
app.ket-qua.email.from=${RESULT_EMAIL_FROM:}
app.ket-qua.email.poll-ms=${RESULT_EMAIL_POLL_MS:10000}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000