spring.application.name=qldt

# Cấu hình kết nối MySQL (Database ql_detai_sinhvien)
spring.datasource.url=jdbc:mysql://localhost:3306/ql_detai_sinhvien?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=mi123@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate (Không tự động can thiệp sửa bảng)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tắt Flyway tự động quét (do đã chạy script SQL thủ công)
spring.flyway.enabled=false

# Port máy chủ web (đổi sang 8081 do cổng 8080 đang có Tomcat dịch vụ máy chạy)
server.port=8081